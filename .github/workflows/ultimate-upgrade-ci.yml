name: RADAR Ultimate Launch CI

on:
  push:
    branches: [ultimate-upgrade]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Static verification
        run: npm run check
      - name: Smoke tests
        run: npm run smoke
      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
